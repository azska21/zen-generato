<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дзен Генератор</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --surface: #ede8df;
    --card: #ffffff;
    --border: #d4cfc5;
    --accent: #e8420a;
    --accent2: #1a1a2e;
    --text: #1a1a1a;
    --muted: #7a7570;
    --success: #1a7a4a;
    --ink: #2a1f1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans', sans-serif;
    min-height: 100vh;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0,0,0,0.04) 39px, rgba(0,0,0,0.04) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0,0,0,0.03) 39px, rgba(0,0,0,0.03) 40px);
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  .header {
    margin-bottom: 52px;
    position: relative;
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .logo {
    font-family: 'Dela Gothic One', sans-serif;
    font-size: clamp(36px, 7vw, 64px);
    line-height: 0.95;
    color: var(--ink);
    letter-spacing: -1px;
  }

  .logo span {
    color: var(--accent);
    display: block;
  }

  .version-tag {
    background: var(--accent);
    color: white;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 2px;
    margin-top: 8px;
    align-self: flex-start;
  }

  .subtitle {
    margin-top: 16px;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 420px;
    border-left: 2px solid var(--accent);
    padding-left: 12px;
  }

  /* Settings toggle */
  .settings-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-family: 'Noto Sans', sans-serif;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .settings-toggle:hover { border-color: var(--accent); color: var(--accent); }

  /* Settings panel */
  .settings-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
    display: none;
    box-shadow: 4px 4px 0 var(--border);
  }
  .settings-panel.open { display: block; }

  .settings-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 500px) { .settings-row { grid-template-columns: 1fr; } }

  /* Form */
  .field { margin-bottom: 0; }

  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  input, select, textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 11px 14px;
    color: var(--text);
    font-family: 'Noto Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    background: white;
  }
  select option { background: white; }
  textarea { resize: vertical; min-height: 80px; }

  .save-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .saved-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
    display: none;
  }
  .saved-dot.on { display: inline-block; }

  /* Main form card */
  .main-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
    margin-bottom: 20px;
    box-shadow: 4px 4px 0 var(--border);
  }

  .section-label {
    font-family: 'Dela Gothic One', sans-serif;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Product preview */
  .product-preview {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    margin-top: 12px;
    margin-bottom: 16px;
  }
  .product-preview.show { display: flex; align-items: center; gap: 12px; }

  .preview-icon {
    font-size: 28px;
    flex-shrink: 0;
  }

  .preview-name {
    font-weight: 600;
    font-size: 14px;
    line-height: 1.4;
    color: var(--ink);
  }
  .preview-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Tone selector */
  .tone-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .tone-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    font-family: 'Noto Sans', sans-serif;
    color: var(--text);
  }
  .tone-btn:hover { border-color: var(--accent); }
  .tone-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .tone-name { font-size: 13px; font-weight: 600; display: block; }
  .tone-desc { font-size: 11px; opacity: 0.7; margin-top: 2px; display: block; }

  /* Generate button */
  .gen-btn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 16px;
    font-family: 'Dela Gothic One', sans-serif;
    font-size: 18px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 4px 4px 0 #b53008;
    position: relative;
    top: 0;
  }
  .gen-btn:hover:not(:disabled) {
    top: 2px;
    box-shadow: 2px 2px 0 #b53008;
  }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; top: 0; }

  /* Status */
  .status {
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--muted);
    padding: 14px 0;
  }
  .status.on { display: flex; }

  .dots span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s ease-in-out infinite;
    margin: 0 2px;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* Error */
  .error {
    display: none;
    background: #fff5f5;
    border: 1px solid #ffcccc;
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 13px;
    color: #cc0000;
    margin-bottom: 16px;
  }
  .error.on { display: block; }

  /* Result card */
  .result-card {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 4px 4px 0 var(--border);
    margin-bottom: 20px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .result-card.show { display: block; }

  .result-header {
    background: var(--ink);
    color: white;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .result-title {
    font-family: 'Dela Gothic One', sans-serif;
    font-size: 14px;
    letter-spacing: 0.5px;
  }

  .stats-row {
    display: flex;
    gap: 20px;
  }

  .stat {
    text-align: center;
  }
  .stat-n {
    font-family: 'Dela Gothic One', sans-serif;
    font-size: 18px;
    color: var(--accent);
  }
  .stat-l {
    font-size: 10px;
    opacity: 0.5;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .result-body {
    padding: 28px;
  }

  .result-text {
    font-size: 15px;
    line-height: 1.85;
    color: var(--ink);
    white-space: pre-wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 16px;
  }

  .result-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .act-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: 'Noto Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    transition: all 0.15s;
  }
  .act-btn:hover { border-color: var(--accent); color: var(--accent); }
  .act-btn.primary {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
  }
  .act-btn.primary:hover { background: var(--accent); border-color: var(--accent); }

  /* History */
  .history-section {
    margin-top: 40px;
  }

  .history-title {
    font-family: 'Dela Gothic One', sans-serif;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .history-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .history-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .history-item:hover { border-color: var(--accent); }

  .history-name { font-size: 13px; font-weight: 600; }
  .history-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .history-del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    line-height: 1;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .history-del:hover { color: var(--accent); }

  .empty-history {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 20px;
    border: 1px dashed var(--border);
    border-radius: 6px;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div>
        <div class="logo">ДЗЕН<span>ГЕНЕРА<br>ТОР</span></div>
        <p class="subtitle">Вставь ссылку с Яндекс Маркета — получи готовый обзор для Дзен с реф-ссылкой</p>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
        <div class="version-tag">v2.0</div>
        <button class="settings-toggle" onclick="toggleSettings()">⚙️ Настройки</button>
      </div>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-row">
      <div class="field">
        <label>OpenRouter API Key</label>
        <input type="password" id="apiKey" placeholder="sk-or-v1-..." oninput="saveSettings()" />
      </div>
      <div class="field">
        <label>Модель</label>
        <select id="modelSelect" onchange="saveSettings()">
          <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B 🆓</option>
          <option value="google/gemma-3-27b-it:free">Gemma 3 27B 🆓</option>
          <option value="mistralai/mistral-7b-instruct:free">Mistral 7B 🆓</option>
          <option value="deepseek/deepseek-chat-v3-0324:free">DeepSeek V3 🆓</option>
          <option value="qwen/qwen3-30b-a3b:free">Qwen3 30B 🆓</option>
        </select>
      </div>
    </div>
    <div class="settings-row" style="margin-top:12px">
      <div class="field">
        <label>Твоя реф-ссылка (база)</label>
        <input type="text" id="refBase" placeholder="https://market.yandex.ru/...?clid=XXXXX" oninput="saveSettings()" />
      </div>
      <div class="field" style="display:flex;align-items:flex-end;padding-bottom:0">
        <a href="https://openrouter.ai/keys" target="_blank" style="font-size:12px;color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent);padding-bottom:2px">
          → Получить ключ на openrouter.ai
        </a>
      </div>
    </div>
    <div class="save-hint">
      <div class="saved-dot" id="savedDot"></div>
      <span id="saveHintText">Данные сохраняются в браузере автоматически</span>
    </div>
  </div>

  <!-- Error -->
  <div class="error" id="errorBox"></div>

  <!-- Main Form -->
  <div class="main-card">
    <div class="section-label">01 — ТОВАР</div>

    <div class="field">
      <label>Ссылка с Яндекс Маркета</label>
      <input type="text" id="marketUrl"
        placeholder="https://market.yandex.ru/product/..."
        oninput="parseUrl(this.value)" />
    </div>

    <div class="product-preview" id="productPreview">
      <div class="preview-icon">📦</div>
      <div>
        <div class="preview-name" id="previewName">—</div>
        <div class="preview-sub" id="previewSub">—</div>
      </div>
    </div>

    <div class="field" style="margin-top:4px">
      <label>Название товара (можно поправить)</label>
      <input type="text" id="productName" placeholder="Например: Органайзер для кухни Brabantia" />
    </div>

    <div class="settings-row" style="margin-bottom:20px">
      <div class="field">
        <label>Цена (₽)</label>
        <input type="number" id="productPrice" placeholder="1490" min="1" />
      </div>
      <div class="field">
        <label>Рейтинг (опционально)</label>
        <input type="text" id="productRating" placeholder="4.8 ⭐" />
      </div>
    </div>

    <div class="section-label">02 — СТИЛЬ</div>

    <div class="tone-grid">
      <button class="tone-btn active" data-tone="живой и дружелюбный" onclick="selectTone(this)">
        <span class="tone-name">😊 Живой</span>
        <span class="tone-desc">Как рассказ другу</span>
      </button>
      <button class="tone-btn" data-tone="экспертный и подробный" onclick="selectTone(this)">
        <span class="tone-name">🎓 Экспертный</span>
        <span class="tone-desc">С разбором характеристик</span>
      </button>
      <button class="tone-btn" data-tone="восторженный, с wow-эффектом" onclick="selectTone(this)">
        <span class="tone-name">🔥 Восторженный</span>
        <span class="tone-desc">Эмоционально, ярко</span>
      </button>
      <button class="tone-btn" data-tone="практичный и честный, с плюсами и минусами" onclick="selectTone(this)">
        <span class="tone-name">✅ Честный</span>
        <span class="tone-desc">Плюсы и минусы</span>
      </button>
    </div>

    <button class="gen-btn" id="genBtn" onclick="generate()">
      СОЗДАТЬ ОБЗОР →
    </button>

    <div class="status" id="status">
      <div class="dots"><span></span><span></span><span></span></div>
      <span id="statusText">Генерируем обзор...</span>
    </div>
  </div>

  <!-- Result -->
  <div class="result-card" id="resultCard">
    <div class="result-header">
      <div class="result-title">ГОТОВЫЙ ТЕКСТ ДЛЯ ДЗЕН</div>
      <div class="stats-row" id="statsRow"></div>
    </div>
    <div class="result-body">
      <div class="result-text" id="resultText"></div>
      <div class="result-actions">
        <button class="act-btn primary" onclick="copyText()">📋 Скопировать</button>
        <button class="act-btn" onclick="regenerate()">🔄 Ещё раз</button>
        <button class="act-btn" onclick="clearResult()">✕ Закрыть</button>
      </div>
    </div>
  </div>

  <!-- History -->
  <div class="history-section">
    <div class="history-title">ИСТОРИЯ</div>
    <div id="historyList"></div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────
let selectedTone = 'живой и дружелюбный';
let lastText = '';
let lastProductName = '';

// ── Init ───────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadSettings();
  renderHistory();
});

// ── Settings ───────────────────────────────────────────
function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
}

function saveSettings() {
  localStorage.setItem('zen_apikey', document.getElementById('apiKey').value);
  localStorage.setItem('zen_refbase', document.getElementById('refBase').value);
  localStorage.setItem('zen_model', document.getElementById('modelSelect').value);
  const dot = document.getElementById('savedDot');
  dot.classList.add('on');
  document.getElementById('saveHintText').textContent = 'Сохранено ✓';
  setTimeout(() => {
    dot.classList.remove('on');
    document.getElementById('saveHintText').textContent = 'Данные сохраняются в браузере автоматически';
  }, 2000);
}

function loadSettings() {
  const key = localStorage.getItem('zen_apikey');
  const ref = localStorage.getItem('zen_refbase');
  if (key) document.getElementById('apiKey').value = key;
  if (ref) document.getElementById('refBase').value = ref;
  const model = localStorage.getItem('zen_model');
  if (model) document.getElementById('modelSelect').value = model;
}

// ── URL Parser ─────────────────────────────────────────
function parseUrl(url) {
  if (!url || url.length < 10) {
    document.getElementById('productPreview').classList.remove('show');
    return;
  }

  // Extract product name from Yandex Market URL patterns
  // e.g. /product--nazvanie-tovara/123456
  let name = '';
  let id = '';

  try {
    const u = new URL(url);
    const parts = u.pathname.split('/').filter(Boolean);

    // Find segment after "product" or "product--"
    const pIdx = parts.findIndex(p => p === 'product' || p.startsWith('product--'));
    if (pIdx !== -1) {
      const slug = parts[pIdx];
      if (slug.includes('--')) {
        // /product--nazvanie-tovara/id
        name = slug.replace('product--', '').replace(/-/g, ' ');
      } else if (parts[pIdx + 1]) {
        // /product/nazvanie-tovara
        name = parts[pIdx + 1].replace(/-/g, ' ');
      }
      // Get numeric ID
      const idPart = parts.find((p, i) => i > pIdx && /^\d+$/.test(p));
      if (idPart) id = idPart;
    }

    // Capitalize
    if (name) {
      name = name.charAt(0).toUpperCase() + name.slice(1);
    }
  } catch(e) {
    // Not a valid URL yet
    return;
  }

  if (name) {
    document.getElementById('productName').value = name;
    document.getElementById('previewName').textContent = name;
    document.getElementById('previewSub').textContent = id ? `ID товара: ${id}` : 'Товар найден в ссылке';
    document.getElementById('productPreview').classList.add('show');
  } else {
    document.getElementById('previewName').textContent = 'Ссылка получена';
    document.getElementById('previewSub').textContent = 'Введи название товара вручную';
    document.getElementById('productPreview').classList.add('show');
  }
}

// ── Tone ───────────────────────────────────────────────
function selectTone(btn) {
  document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedTone = btn.dataset.tone;
}

// ── OpenRouter ─────────────────────────────────────────
async function callAI(prompt) {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) throw new Error('Введи OpenRouter API Key в настройках (⚙️)');
  const model = document.getElementById('modelSelect').value;

  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`,
      'HTTP-Referer': window.location.href,
      'X-Title': 'Дзен Генератор'
    },
    body: JSON.stringify({
      model,
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.85,
      max_tokens: 2048
    })
  });

  if (!res.ok) {
    const e = await res.json();
    throw new Error(e.error?.message || `Ошибка API (${res.status})`);
  }
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.choices[0].message.content;
}

// ── Generate ───────────────────────────────────────────────
async function generate() {
  hideError();

  const name = document.getElementById('productName').value.trim();
  const price = document.getElementById('productPrice').value.trim();
  const rating = document.getElementById('productRating').value.trim();
  const marketUrl = document.getElementById('marketUrl').value.trim();
  const refBase = document.getElementById('refBase').value.trim();

  if (!name) { showError('Введи название товара'); return; }
  if (!marketUrl && !refBase) { showError('Введи ссылку с Маркета'); return; }

  const refLink = marketUrl || refBase;

  setLoading(true);
  setStatus('Пишем обзор...');

  try {
    const prompt = `Ты опытный автор блога Яндекс Дзен. Напиши живой обзор товара для публикации в Дзен.

Товар: ${name}
${price ? `Цена: ~${price} рублей` : ''}
${rating ? `Рейтинг: ${rating}` : ''}
Тон: ${selectedTone}
Ссылка для покупки: ${refLink}

Правила написания:
- Длина: 1800–2500 символов
- Начни с яркого ЗАГОЛОВКА на первой строке (без слова "Обзор:", без # символов)
- После заголовка — пустая строка, потом текст
- Первый абзац: личная история или проблема которую решает товар
- 3–4 конкретных плюса с деталями
- 1 небольшой минус (это делает текст честным и живым)
- Финал: призыв к действию, вставь ссылку ${refLink} естественно в текст
- Не используй markdown заголовки (#, ##), списки (- или *), звёздочки для выделения
- Пиши сплошным текстом с абзацами, разделёнными пустой строкой
- Только текст статьи, без пояснений и предисловий`;

    const text = await callAI(prompt);
    lastText = text;
    lastProductName = name;

    showResult(text, name, refLink);
    saveToHistory(name, text, price, refLink);

  } catch(e) {
    showError(e.message);
  } finally {
    setLoading(false);
  }
}

function regenerate() {
  generate();
}

// ── UI helpers ─────────────────────────────────────────
function setLoading(on) {
  document.getElementById('genBtn').disabled = on;
  document.getElementById('status').classList.toggle('on', on);
}

function setStatus(t) { document.getElementById('statusText').textContent = t; }

function showError(msg) {
  const b = document.getElementById('errorBox');
  b.textContent = '❌ ' + msg;
  b.classList.add('on');
}

function hideError() { document.getElementById('errorBox').classList.remove('on'); }

function showResult(text, name, link) {
  const chars = text.length;
  const words = text.split(/\s+/).length;
  const mins = Math.ceil(words / 200);

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="stat-n">${chars.toLocaleString()}</div><div class="stat-l">симв</div></div>
    <div class="stat"><div class="stat-n">${words}</div><div class="stat-l">слов</div></div>
    <div class="stat"><div class="stat-n">${mins}м</div><div class="stat-l">чтение</div></div>
  `;
  document.getElementById('resultText').textContent = text;
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function clearResult() {
  document.getElementById('resultCard').classList.remove('show');
}

function copyText() {
  navigator.clipboard.writeText(lastText).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✅ Скопировано!';
    setTimeout(() => btn.textContent = orig, 2000);
  });
}

// ── History ────────────────────────────────────────────
function saveToHistory(name, text, price, link) {
  const history = JSON.parse(localStorage.getItem('zen_history') || '[]');
  history.unshift({
    id: Date.now(),
    name,
    text,
    price,
    link,
    date: new Date().toLocaleDateString('ru-RU')
  });
  // Keep last 20
  localStorage.setItem('zen_history', JSON.stringify(history.slice(0, 20)));
  renderHistory();
}

function renderHistory() {
  const history = JSON.parse(localStorage.getItem('zen_history') || '[]');
  const list = document.getElementById('historyList');

  if (!history.length) {
    list.innerHTML = '<div class="empty-history">Здесь появятся сгенерированные обзоры</div>';
    return;
  }

  list.innerHTML = history.map(h => `
    <div class="history-item" onclick="loadFromHistory(${h.id})">
      <div>
        <div class="history-name">${h.name}</div>
        <div class="history-meta">${h.date} · ${h.text.length} симв${h.price ? ' · ' + Number(h.price).toLocaleString() + ' ₽' : ''}</div>
      </div>
      <button class="history-del" onclick="deleteHistory(event, ${h.id})">✕</button>
    </div>
  `).join('');
}

function loadFromHistory(id) {
  const history = JSON.parse(localStorage.getItem('zen_history') || '[]');
  const h = history.find(x => x.id === id);
  if (!h) return;
  lastText = h.text;
  lastProductName = h.name;
  showResult(h.text, h.name, h.link || '');
}

function deleteHistory(e, id) {
  e.stopPropagation();
  let history = JSON.parse(localStorage.getItem('zen_history') || '[]');
  history = history.filter(h => h.id !== id);
  localStorage.setItem('zen_history', JSON.stringify(history));
  renderHistory();
}
</script>
